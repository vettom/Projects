{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "promshim-http-sd.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "promshim-http-sd.labels" . | nindent 4 }}
spec:
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.httpRoute.gatewayName }}
      namespace: {{ .Values.httpRoute.gatewayNamespace }}
      sectionName: {{ .Values.httpRoute.sectionName }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ .Chart.Name }}
          port: {{ .Values.service.port }}
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
